[workspace]
members = ["core", "cli", "tools/uniffi-bindgen", "tools/zcash-fixture", "tools/litecoin-mweb-fixture"]
resolver = "3"

# Dependencies are optimized even in debug and test builds. Key stretching
# (PBKDF2 through ring, see core/src/secrets/kdf.rs), curve arithmetic and hashing run
# in dependency code, which unoptimized made each password unlock in a debug
# CLI, app or test take about three seconds instead of under a tenth. Our own
# crates stay unoptimized, so an edit rebuilds as fast as before; a
# dependency is compiled once.
[profile.dev.package."*"]
opt-level = 3

# Line tables, not full debug info: a panic's backtrace still names its file
# and line, while full variable info doubled core's compile time and grew the
# iOS static library to 1.8 GB, which every app link and simulator install
# then carried. A debugger session that needs locals can build with
# CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

# The MIR scan's build (scripts/unwritten-record-fields.py), kept apart so
# that emitting MIR never invalidates the dev build the tests and the CLI
# use. MIR carries no debug info, and the binary is never run, so nothing
# is stripped from it either.
[profile.mir-scan]
inherits = "dev"
debug = false
strip = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Release builds wrap on integer overflow by default. A wrapped amount can make
# the wallet believe it can afford a spend, so our crates panic instead.
# Dependencies are left alone: some crypto crates rely on wrapping arithmetic.
[profile.release.package.spectra_core]
overflow-checks = true

[profile.release.package.spectra_cli]
overflow-checks = true
