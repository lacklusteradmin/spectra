name: CI

# The gate for the two suites that need no Xcode. The iOS suite
# (`make test-ios`) needs a simulator and stays local; see AGENTS.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A wallet's arithmetic bugs are invisible in debug and silent in release,
  # so fail loudly here rather than backtrace-lessly.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; rustup honours it on first use,
      # so nothing here names a toolchain and the two cannot drift apart.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # The Makefile is the one list of gates: a scan added there gates here.
      - name: Lint
        run: make lint

      - name: Tests
        run: make test

  cli-acceptance:
    name: CLI acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # The suite runs offline against throwaway directories, on Python's
      # standard library alone.
      - name: Tool versions
        run: python3 --version

      # Builds the CLI and the Zcash and MWEB fixtures, then runs the suite.
      - name: Acceptance suite
        run: make test-cli
