[package]
name = "spectra_core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bip39 = { version = "2", features = ["all-languages"] }
unicode-normalization = "0.1"
secp256k1 = { version = "0.29", features = ["alloc", "global-context", "hashes", "recovery", "rand"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "digest", "fast", "pkcs8", "rand_core", "zeroize"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
schnorrkel = { version = "0.11", default-features = false, features = ["std"] }
frame-metadata = { version = "23", default-features = false, features = ["std", "current", "decode"] }
parity-scale-codec = "3"
scale-info = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
candid = "0.10"
ic-certification = "3.2.0"
ic-cbor = "3.2.0"
ic-certificate-verification = "3.2.0"
num-bigint = "0.4"
hmac = "0.12"
sha2 = "0.10"
# PBKDF2 (`kdf.rs`); already built for rustls.
ring = "0.17"
bs58 = { version = "0.5", features = ["check"] }
bech32 = "0.11"
ripemd = "0.1"
sha3 = "0.10"
blake2 = "0.10"
blake2b_simd = "1.0"
data-encoding = "2"
crc = "3"
alloy-rlp = { version = "0.3", features = ["derive"] }
bitcoin = { version = "0.32", features = ["rand-std"] }
monero-wallet = "0.2"
monero-daemon-rpc = "0.2"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["alloc", "derive"] }
uniffi = { version = "0.31.2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
hex = { version = "0.4", features = ["serde"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "socks"] }
arti-client = { version = "0.41", default-features = false, features = ["rustls", "tokio"] }
tor-rtcompat = { version = "0.41", default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Zcash shielded wallets: keys, scanning, proposals and proofs from
# librustzcash; a lightwalletd server's gRPC through `api::grpc`.
zcash_client_backend = { version = "0.24", default-features = false, features = ["lightwalletd-tonic-transport", "orchard", "transparent-inputs"] }
zcash_client_sqlite = { version = "0.22", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_keys = { version = "0.16", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = "0.10"
zcash_primitives = { version = "0.30", features = ["transparent-inputs"] }
zcash_proofs = { version = "0.30", default-features = false, features = ["local-prover"] }
zip32 = "0.2"
zcash_transparent = { version = "0.10", features = ["transparent-inputs"] }
zcash_script = "0.4"
sapling-crypto = "0.7"
orchard = { version = "0.15", default-features = false, features = ["std"] }
secrecy = "0.8"
jubjub = "0.10"
bls12_381 = "0.8"
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
http = "1"
# Litecoin MWEB: BLAKE3 hashes, the scrypt of a header's proof of work, and
# secp256k1-zkp's bulletproofs through Grin's binding (the library Litecoin's
# own fork descends from).
blake3 = "1"
scrypt = { version = "0.11", default-features = false }
grin_secp256k1zkp = "0.8"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
wiremock = "0.6"
