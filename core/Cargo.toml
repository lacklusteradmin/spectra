[package]
name = "spectra_core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bip39 = { version = "2", features = ["all-languages"] }
unicode-normalization = "0.1"
pbkdf2 = "0.12"
secp256k1 = { version = "0.29", features = ["alloc", "global-context", "hashes", "recovery", "rand"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "digest", "fast", "pkcs8", "rand_core", "zeroize"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
schnorrkel = { version = "0.11", default-features = false, features = ["std"] }
frame-metadata = { version = "23", default-features = false, features = ["std", "current", "decode"] }
parity-scale-codec = "3"
scale-info = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
candid = "0.10"
ic-certification = "3.2.0"
ic-cbor = "3.2.0"
ic-certificate-verification = "3.2.0"
num-bigint = "0.4"
hmac = "0.12"
sha2 = "0.10"
bs58 = { version = "0.5", features = ["check"] }
bech32 = "0.11"
ripemd = "0.1"
sha3 = "0.10"
blake2 = "0.10"
blake2b_simd = "1.0"
data-encoding = "2"
crc = "3"
alloy-rlp = { version = "0.3", features = ["derive"] }
bitcoin = { version = "0.32", features = ["rand-std"] }
monero-wallet = "0.2"
monero-daemon-rpc = "0.2"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["alloc", "derive"] }
uniffi = { version = "0.31.2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "socks"] }
arti-client = { version = "0.22", default-features = false, features = ["rustls", "tokio"] }
tor-rtcompat = { version = "0.22", default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
wiremock = "0.6"
