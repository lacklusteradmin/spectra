# Concrete network identities, operational rules and presentation. Mainnets and testnets are peers.
# Each network declares its supported token protocols; deployments own their actual standard.
# EVM membership is defined by registry::Chain, not configured here.
# Native token metadata belongs to tokens.toml (testnet-tokens.toml for testnets);
# core derives the native deployment ID as "<chain_id>:native".
#
# Every network carries its search keywords, color, artwork and address hint.
# `popular_rank` and authored `tags` belong on mainnets only; testnets inherit both.
# Ranks order the picker, 1..=n without gaps. Picker and wiki share the same tags.
# `layer-1`, `evm` and `testnet` are derived from the registry and refused here.
# `faucet` is a test network's faucet page, checked live to name that exact
# network (docs/audits/testnet-faucets-2026-10-07.json); testnets only.

[[chains]]
id = "bitcoin"
name = "Bitcoin"
family = "bitcoin"
environment = "mainnet"
token_standards = []
derivation_path = [
  { tag = "nativeSegWit", path = "m/84'/0'/{account}'/0/0", is_default = true },
  { tag = "legacy", path = "m/44'/0'/{account}'/0/0" },
  { tag = "nestedSegWit", path = "m/49'/0'/{account}'/0/0" },
  { tag = "taproot", path = "m/86'/0'/{account}'/0/0" },
]
search_keywords = ["Bitcoin", "BTC"]
popular_rank = 1
