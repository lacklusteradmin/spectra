# Explorers: the web pages a transaction's detail screen and a wallet's page
# link to, at most one explorer per network. `chain_id` references a concrete
# chains.id in chains.toml; `{hash}` in `tx_url` is replaced by the
# transaction hash, and `{address}` in `address_url` by the wallet's address.
# A network whose explorer has no address page (Monero's, by design) has no
# `address_url`.
#
# Spectra never requests these pages. Anything it does request is an API and
# belongs in endpoints.toml.

[[explorers]]
chain_id = "bitcoin"
name = "Mempool"
tx_url = "https://mempool.space/tx/{hash}"
address_url = "https://mempool.space/address/{address}"

