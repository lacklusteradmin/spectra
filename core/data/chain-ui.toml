# Network presentation only. Each chain_id references chains.toml chains.id.
# Every concrete network has one row; display tags never decide protocol behavior.
#
# `popular_rank` and `tags` are written on mainnet rows only. A testnet takes
# both from its mainnet, so it cannot drift from the chain it mirrors.
#
# `popular_rank` orders the chain picker: every mainnet has one, 1..=n without
# gaps. `tags` lists the authored tags; `layer-1`, `evm` and `testnet` are
# derived from the registry and refused here.

