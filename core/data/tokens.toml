# Mainnet token identities and deployments. Testnet assets live in testnet-tokens.toml.
# Reverified issuer and bridge sources: docs/audits/token-verification-2026-10-04/README.md.
# Sources of the deployments added on 2026-11-24: docs/audits/token-additions-2026-11-24/README.md
# and docs/audits/token-catalog-2026-11-24/README.md, which also audits every earlier deployment.
# Deployments reference tokens.id via token_id and chains.toml chains.id via chain_id.
# Symbols are display labels. Precision belongs to the deployment.
# Core derives deployment IDs from network, standard and contract; no stored deployment ID.
# A deployment with a `standard` and `contract` is a token; one with neither is the network's own coin.
# Keep each token immediately followed by its deployments; both tables are top-level.

