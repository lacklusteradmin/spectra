# What staking on a chain means, for a reader: the staking tab's copy.
#
# Editorial, like `chain-wiki.toml`: nothing computes anything from these
# fields, and they are reachable only from `list_staking_chains()`. They are
# per-chain facts all the same, so they live beside the catalog rather than in
# a front end, where the CLI could not show them and a second front end would
# have to copy them.
#
# One row per chain that `Chain::supports_staking`, joined to `chains.toml` by
# `chain`; core refuses to load a table that misses one or names another. The
# table describes protocol mechanics. A validator directory does not claim
# a yield without chain evidence.
#
# Queries and signed actions resolve current balances, minimums and protocol state.

[[chains]]
chain = "solana"
short_mechanic = "Delegate to a vote account; rewards each epoch (~2 days)."
unbonding_period = "2–3 days deactivation"
minimum_stake = "Current on-chain minimum delegation + stake-account rent"
explanation = "Each stake position is an on-chain stake account created with a wallet-derived seeded address and delegated to a vote account. The wallet retains stake and withdrawal authority. Rewards compound into the stake account; deactivation and withdrawal depend on the current epoch and lockup state."

[[chains]]
chain = "sui"
short_mechanic = "Move call `request_add_stake` to a validator; epoch ~24h."
unbonding_period = "Withdrawal returns principal and rewards in the execution transaction"
minimum_stake = "1 SUI"
explanation = "Staking creates a `StakedSui` object owned by your wallet. To unstake, the same object is passed to `request_withdraw_stake`; principal and available rewards return in that transaction, subject to the live stake-object state."

[[chains]]
chain = "aptos"
short_mechanic = "Add stake to a delegation pool; epoch ~2h."
unbonding_period = "~30-day lockup cycle"
minimum_stake = "Current delegation-pool minimum after commission"
explanation = "Calls `0x1::delegation_pool::add_stake` against a pool address. Stake activates at the next epoch. Unlock moves it to a pending-inactive bucket; after the lockup cycle (typically 30 days) it becomes withdrawable."

[[chains]]
chain = "near"
short_mechanic = "`deposit_and_stake` on a verified staking-pool contract."
unbonding_period = "~52h (4 epochs)"
minimum_stake = "Pool-dependent"
explanation = "Each validator runs its own staking-pool contract; staking calls `deposit_and_stake` with NEAR attached. Unstake places funds into a pending bucket; after 4 epochs (~52h) they're withdrawable via `withdraw`."


[[chains]]
chain = "polkadot"
short_mechanic = "Join a nomination pool on Polkadot Asset Hub."
unbonding_period = "Until the runtime unbonding era matures"
minimum_stake = "Current on-chain pool minimum"
explanation = "Nomination Pools hold DOT on Polkadot Asset Hub. Pool points convert to balances through the runtime, including any slashes. Unbonded funds become withdrawable when their unlock era matures; rewards are claimed separately. Legacy pool and member delegation state is migrated atomically when an action requires it."

[[chains]]
chain = "internet-computer"
short_mechanic = "Stake into an NNS governance neuron."
unbonding_period = "The neuron's configured dissolve delay"
minimum_stake = "Current NNS governance minimum"
explanation = "The wallet funds a derived NNS neuron account, claims the neuron, sets an explicitly reviewed dissolve delay and follows a known neuron. Spectra accepts delays up to two years. Starting dissolution applies to the entire neuron; disbursement requires an unlocked controlled position. Claiming maturity queues a delayed, governance-modulated payout. Every funding and management ingress is signed locally and requires its own certified execution receipt."
