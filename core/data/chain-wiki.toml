# Spectra chain wiki — what a chain *is*, for a reader.
#
# A separate table from `chains.toml` because prose describes the chain rather
# than deciding protocol behavior. A wrong value here is a wrong sentence on
# a page; a wrong value in `chains.toml`
# is a wrong address or a wrong balance. Keeping them apart means an editorial
# edit never touches the file that decides derivation paths.
#
# The split is enforced by the type, not by this comment: these fields live on
# `ChainWikiEntry` and are reachable only from `list_chain_wiki()`, so nothing
# in the send, derive or fetch paths can read them.
#
# `total_circulation_model` left for `crypto-wiki.toml`: a supply cap is a fact
# about the coin, not about the network that mints it. What stays here is what
# has no coin to belong to — ten chains share ETH, and "Base is an optimistic
# rollup" is not a fact about ETH.
#
# Tags come from `chains.toml` through the same `ChainTag` catalog projection
# as the picker; this file cannot write a second classification.
#
# One row per chain, joined to `chains.toml` by `chain`. Networks have no row:
# a testnet is not a different chain, and the wiki used to filter them out by
# testing `family` for emptiness. The table is the filter now.

