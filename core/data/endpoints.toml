# Filecoin: Lotus nodes and Filfox's address index, probed read-only
# 2026-11-24. Each node answered `StateNetworkName` "mainnet", the mainnet
# genesis CID from `ChainGetGenesis`, `WalletBalance`, `MpoolGetNonce`,
# `GasEstimateMessageGas`, `StateSearchMsg` for a mined message and
# `StateGetActor`, and exposes `MpoolPush` (it refused a call carrying no
# message). Ankr's public node is left out: its `StateSearchMsg` answered
# null for a mined message, which reads as still pending.
[[endpoints]]
id = "filecoin.rpc.glif"
api = "lotus-json-rpc"
chain_id = "filecoin"
endpoint = "https://api.node.glif.io/rpc/v1"
capabilities = ["balance", "fee", "broadcast", "verification"]

[[endpoints]]
id = "filecoin.rpc.filfox"
api = "lotus-json-rpc"
chain_id = "filecoin"
endpoint = "https://filfox.info/rpc/v1"
capabilities = ["balance", "fee", "broadcast", "verification"]

[[endpoints]]
id = "filecoin.rpc.drpc"
api = "lotus-json-rpc"
chain_id = "filecoin"
endpoint = "https://filecoin.drpc.org"
capabilities = ["balance", "fee", "broadcast", "verification"]

